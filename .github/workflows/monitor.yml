name: Daily monitor

on:
  schedule:
    - cron: "15 13 * * *"      # 13:15 UTC daily (05:15 PST / 06:15 PDT)
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore 10-minute data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: monitor-cache-${{ github.run_id }}
          restore-keys: monitor-cache-
      - name: Run monitor
        env:
          ONC_API_TOKEN: ${{ secrets.ONC_API_TOKEN }}
        run: python monitor.py --out site
      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: monitor-cache-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
